name: Feature request
description: Describe a user need and a concrete outcome.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
      description: Explain the problem without including client or personal information.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
