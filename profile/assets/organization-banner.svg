<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Actigence Code — Clear systems. Thoughtful software.</title>
  <desc id="description">A dark blue Actigence banner with blue and green accents. Three connected panels represent Core, Logger, and Theme: shared foundations for a coherent software experience.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071C2C"/>
      <stop offset="1" stop-color="#103A55"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="1360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#115D9C"/>
      <stop offset="0.75" stop-color="#397F96"/>
      <stop offset="1" stop-color="#9AC443"/>
    </linearGradient>
    <linearGradient id="panel" x1="1060" y1="90" x2="1360" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123C55"/>
      <stop offset="1" stop-color="#0B2C42"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" rx="24" fill="url(#background)"/>
  <path d="M80 1H1360" stroke="url(#accent)" stroke-width="3"/>
  <path d="M966 80V440" stroke="#46677B" stroke-opacity="0.4"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="80" y="91" fill="#F2F6F8" font-size="25" font-weight="700" letter-spacing="4">ACTIGENCE</text>
    <path d="M282 66V93" stroke="#44697E"/>
    <text x="306" y="89" fill="#A6C1D1" font-size="17" font-weight="500" letter-spacing="5">CODE</text>

    <text x="77" y="222" fill="#F7FAFC" font-size="72" font-weight="700" letter-spacing="-2.5">Clear systems.</text>
    <text x="77" y="307" fill="#F7FAFC" font-size="72" font-weight="700" letter-spacing="-2.5">Thoughtful software.</text>
    <text x="82" y="359" fill="#A6C1D1" font-size="23" letter-spacing="0.2">Engineering with a shared foundation.</text>

    <path d="M82 431H114" stroke="#9AC443" stroke-width="4" stroke-linecap="round"/>
    <text x="134" y="437" fill="#C8D8E1" font-size="14" font-weight="500" letter-spacing="2.6">PURPOSEFUL. REUSABLE. COHERENT.</text>

    <path d="M1018 127H997V259H1018M997 259V391H1018" stroke="#466D83" stroke-width="2"/>
    <circle cx="997" cy="259" r="5" fill="#9AC443"/>

    <rect x="1018" y="82" width="342" height="90" rx="14" fill="url(#panel)" stroke="#33586F"/>
    <rect x="1040" y="106" width="42" height="42" rx="10" fill="#115D9C"/>
    <path d="M1052 118H1059V125H1052ZM1063 118H1070V125H1063ZM1052 129H1059V136H1052ZM1063 129H1070V136H1063Z" fill="#DCEBF4"/>
    <text x="1103" y="121" fill="#F1F6F9" font-size="19" font-weight="600">Core</text>
    <text x="1103" y="145" fill="#A6C1D1" font-size="14">Common building blocks</text>

    <rect x="1018" y="214" width="342" height="90" rx="14" fill="url(#panel)" stroke="#33586F"/>
    <rect x="1040" y="238" width="42" height="42" rx="10" fill="#193D38"/>
    <path d="M1052 249H1070M1052 259H1064M1052 269H1070" stroke="#9AC443" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1103" y="253" fill="#F1F6F9" font-size="19" font-weight="600">Logger</text>
    <text x="1103" y="277" fill="#A6C1D1" font-size="14">Consistent event logging</text>

    <rect x="1018" y="346" width="342" height="90" rx="14" fill="url(#panel)" stroke="#33586F"/>
    <rect x="1040" y="370" width="42" height="42" rx="10" fill="#153E58"/>
    <circle cx="1056" cy="386" r="7" fill="#669AC0"/>
    <circle cx="1066" cy="396" r="7" fill="#9AC443"/>
    <text x="1103" y="385" fill="#F1F6F9" font-size="19" font-weight="600">Theme</text>
    <text x="1103" y="409" fill="#A6C1D1" font-size="14">A common visual language</text>
  </g>
